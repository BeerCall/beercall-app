# C01 — Compose standalone isolé pour la recette locale de fluidité
# Projet Docker Compose : beercall-fluidite-night
# Aucun port de base ou de backend exposé ; uniquement le proxy nginx local sur 127.0.0.1:5180

services:
  db_beercall:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=beercall
      - POSTGRES_PASSWORD=beercall
      - POSTGRES_DB=beercall_fluidite_demo
    volumes:
      - fluidite_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beercall -d beercall_fluidite_demo"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    labels:
      beercall.test: "fluidite-night"

  migrate:
    build:
      context: ../beercall-backend
    image: beercall-fluidite-backend:local
    depends_on:
      db_beercall:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://beercall:beercall@db_beercall:5432/beercall_fluidite_demo
    command: ["python", "-m", "alembic", "upgrade", "head"]
    labels:
      beercall.test: "fluidite-night"

  backend:
    image: beercall-fluidite-backend:local
    restart: unless-stopped
    depends_on:
      db_beercall:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=test
      - PHOTO_DETECTOR_MODE=always_accept
      - DATABASE_URL=postgresql+psycopg://beercall:beercall@db_beercall:5432/beercall_fluidite_demo
      - BEERCALL_SECRET_KEY=${FLUIDITE_TEST_SECRET:?required}
      - FIREBASE_CREDENTIALS_PATH=
    volumes:
      - fluidite_uploads:/app/uploads
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      beercall.test: "fluidite-night"

  beer_worker:
    image: beercall-fluidite-backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg://beercall:beercall@db_beercall:5432/beercall_fluidite_demo
      - BEERCALL_SECRET_KEY=${FLUIDITE_TEST_SECRET:?required}
      - FIREBASE_CREDENTIALS_PATH=
      - APP_ENV=test
      - PHOTO_DETECTOR_MODE=always_accept
    volumes:
      - fluidite_uploads:/app/uploads
    command: ["python", "-m", "workers.beer_call_worker"]
    labels:
      beercall.test: "fluidite-night"

  daily_worker:
    image: beercall-fluidite-backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg://beercall:beercall@db_beercall:5432/beercall_fluidite_demo
      - BEERCALL_SECRET_KEY=${FLUIDITE_TEST_SECRET:?required}
      - FIREBASE_CREDENTIALS_PATH=
      - APP_ENV=test
    command: ["python", "-m", "workers.daily_checks"]
    labels:
      beercall.test: "fluidite-night"

  avatar-renderer:
    build:
      context: ../beercall-frontend
      dockerfile: tools/avatar-renderer/Dockerfile
    restart: unless-stopped
    shm_size: '1gb'
    mem_limit: 1536m
    volumes:
      - ../beercall-backend/static/models:/models:ro
      - ../beercall-frontend/public/animations:/animations:ro
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - MODELS_DIR=/models
      - ANIMATIONS_DIR=/animations
      - RENDERER_SOFTWARE_GL=1
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      beercall.test: "fluidite-night"

  avatar-sprite-worker:
    image: beercall-fluidite-backend:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      avatar-renderer:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://beercall:beercall@db_beercall:5432/beercall_fluidite_demo
      - BEERCALL_SECRET_KEY=${FLUIDITE_TEST_SECRET:?required}
      - FIREBASE_CREDENTIALS_PATH=
      - AVATAR_RENDERER_URL=http://avatar-renderer:8787
      - AVATAR_SPRITES_ENABLED=true
      - APP_ENV=test
    volumes:
      - fluidite_uploads:/app/uploads
    command: ["python", "-m", "workers.avatar_sprite_worker"]
    labels:
      beercall.test: "fluidite-night"

  frontend:
    build:
      context: ../beercall-frontend
      args:
        - VITE_FF_GLB_AVATAR=${VITE_FF_GLB_AVATAR:-1}
        - VITE_FF_GLB_WORLDS=${VITE_FF_GLB_WORLDS:-1}
        - VITE_WORLD_PROBE=${VITE_WORLD_PROBE:-}
        - VITE_APP_COMMIT=${VITE_APP_COMMIT:-}
        - VITE_APP_BUILD_TIME=${VITE_APP_BUILD_TIME:-}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      beercall.test: "fluidite-night"

  nginx_beercall:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${FLUIDITE_HTTP_PORT:-5180}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      beercall.test: "fluidite-night"

volumes:
  fluidite_db:
    labels:
      beercall.test: "fluidite-night"
  fluidite_uploads:
    labels:
      beercall.test: "fluidite-night"
