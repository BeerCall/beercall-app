version: '3.8'

services:
  # --- DATABASE ---
  db_beercall:
    image: postgres:15-alpine
    container_name: beercall_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - default

  # --- MIGRATIONS ---
  migrate:
    build: ./beercall-backend
    container_name: beercall_migrate
    depends_on:
      db_beercall:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db_beercall:5432/${DB_NAME}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - default

  # --- WORKERS ---
  beer_worker:
    build: ./beercall-backend
    container_name: beercall_beer_worker
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db_beercall:5432/${DB_NAME}
      - BEERCALL_SECRET_KEY=${BEERCALL_SECRET_KEY:?required}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
    volumes:
      - ./beercall-backend/uploads:/app/uploads
      - ./secrets:/run/secrets:ro
    command: ["python", "-m", "workers.beer_call_worker"]
    networks:
      - default

  daily_worker:
    build: ./beercall-backend
    container_name: beercall_daily_worker
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db_beercall:5432/${DB_NAME}
      - BEERCALL_SECRET_KEY=${BEERCALL_SECRET_KEY:?required}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
    command: ["python", "-m", "workers.daily_checks"]
    networks:
      - default

  # --- BACKEND ---
  backend:
    build: ./beercall-backend
    container_name: beercall_backend
    restart: always
    depends_on:
      db_beercall:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - PYTHONUNBUFFERED=1
      # On change l'URL pour pointer vers le container db
      - DATABASE_URL=postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db_beercall:5432/${DB_NAME}
      - BEERCALL_SECRET_KEY=${BEERCALL_SECRET_KEY:?required}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
    volumes:
      - ./beercall-backend/uploads:/app/uploads
      - ./secrets:/run/secrets:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default

  # --- FRONTEND ---
  frontend:
    build:
      context: ./beercall-frontend
      args:
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_DATABASE_URL=${VITE_FIREBASE_DATABASE_URL}
        - VITE_FIREBASE_VAPID_KEY=${VITE_FIREBASE_VAPID_KEY}
    container_name: beercall_frontend
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default

  # --- PROXY INTERNE (Nginx Beer Call) ---
  nginx_beercall:
    image: nginx:alpine
    container_name: beercall_proxy_internal
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=beercall.fr
      - LETSENCRYPT_HOST=beercall.fr
      - VIRTUAL_PORT=80
    networks:
      - proxy-network
      - default
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  proxy-network:
    external: true
  default:
    driver: bridge
