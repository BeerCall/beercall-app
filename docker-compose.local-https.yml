# Override local pour tester la PWA sur iPhone/Android en HTTPS.
# Usage :
#   npm --prefix ../beercall-frontend run build
#   docker compose -f docker-compose.yml -f docker-compose.local-https.yml build backend
#   docker compose -f docker-compose.yml -f docker-compose.local-https.yml up -d --no-build
#
# Les certificats sont générés dans secrets/local-https/ (dossier ignoré par Git).
# Le frontend sert le dist canonique validé, pas la copie d'intégration.
# !reset nécessite Docker Compose >= 2.24.

services:
  backend:
    image: beercall-local-backend:fluidite
    build: ../beercall-backend
    volumes:
      - ../beercall-backend/static/models:/app/static/models:ro

  migrate:
    image: beercall-local-backend:fluidite
    build: ../beercall-backend

  beer_worker:
    image: beercall-local-backend:fluidite
    build: ../beercall-backend

  daily_worker:
    image: beercall-local-backend:fluidite
    build: ../beercall-backend

  frontend:
    image: nginx:stable-alpine
    build: !reset null
    volumes:
      - ../beercall-frontend/dist:/usr/share/nginx/html:ro
      - ../beercall-frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  nginx_beercall:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/local-https/server.crt:/etc/nginx/certs/server.crt:ro
      - ./secrets/local-https/server.key:/etc/nginx/certs/server.key:ro
      - ./secrets/local-https/ca.crt:/usr/share/nginx/local/ca.crt:ro
      - ./secrets/local-https/setup.html:/usr/share/nginx/local/setup.html:ro
      - ../beercall-backend/static/models:/srv/models:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ca.crt"]
