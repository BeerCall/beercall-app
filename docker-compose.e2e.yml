name: beercall-e2e

volumes:
  uploads_e2e:

x-backend-build: &backend_build
  context: ./beercall-backend
  args:
    PYTHON_IMAGE: ${BEERCALL_E2E_PYTHON_IMAGE:-python:3.13-slim}

services:
  migrate_e2e:
    build: *backend_build
    environment:
      - DATABASE_URL=postgresql+psycopg://test_user:test_password@db_e2e:5432/test_db
    depends_on:
      db_e2e:
        condition: service_healthy
    command: python -m alembic upgrade head

  db_e2e:
    image: ${BEERCALL_E2E_POSTGRES_IMAGE:-postgres:15-alpine}
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_e2e:
    build: *backend_build
    environment:
      - DATABASE_URL=postgresql+psycopg://test_user:test_password@db_e2e:5432/test_db
      - BEERCALL_SECRET_KEY=${BEERCALL_E2E_SECRET_KEY:?Set BEERCALL_E2E_SECRET_KEY}
      - APP_ENV=test
      - PHOTO_DETECTOR_MODE=always_accept
    volumes:
      - uploads_e2e:/app/uploads
    ports:
      - "8000:8000"
    networks:
      default:
        aliases: [backend]
    depends_on:
      db_e2e:
        condition: service_healthy
      migrate_e2e:
        condition: service_completed_successfully
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000

  beer_worker_e2e:
    build: *backend_build
    environment:
      - DATABASE_URL=postgresql+psycopg://test_user:test_password@db_e2e:5432/test_db
      - BEERCALL_SECRET_KEY=${BEERCALL_E2E_SECRET_KEY:?Set BEERCALL_E2E_SECRET_KEY}
      - APP_ENV=test
      - PHOTO_DETECTOR_MODE=always_accept
    volumes:
      - uploads_e2e:/app/uploads
    depends_on:
      migrate_e2e:
        condition: service_completed_successfully
    command: python -m workers.beer_call_worker

  beer_worker_e2e_2:
    build: *backend_build
    environment:
      - DATABASE_URL=postgresql+psycopg://test_user:test_password@db_e2e:5432/test_db
      - BEERCALL_SECRET_KEY=${BEERCALL_E2E_SECRET_KEY:?Set BEERCALL_E2E_SECRET_KEY}
      - APP_ENV=test
      - PHOTO_DETECTOR_MODE=always_accept
    volumes:
      - uploads_e2e:/app/uploads
    depends_on:
      migrate_e2e:
        condition: service_completed_successfully
    command: python -m workers.beer_call_worker

  daily_worker_e2e:
    build: *backend_build
    environment:
      - DATABASE_URL=postgresql+psycopg://test_user:test_password@db_e2e:5432/test_db
      - APP_ENV=test
      - BEERCALL_SECRET_KEY=${BEERCALL_E2E_SECRET_KEY:?Set BEERCALL_E2E_SECRET_KEY}
    depends_on:
      migrate_e2e:
        condition: service_completed_successfully
    command: python -m workers.daily_checks

  frontend_e2e:
    build:
      context: ./beercall-frontend
      args:
        NODE_IMAGE: ${BEERCALL_E2E_NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${BEERCALL_E2E_NGINX_IMAGE:-nginx:stable-alpine}
    networks:
      default:
        aliases: [frontend]

  proxy_e2e:
    image: ${BEERCALL_E2E_PROXY_IMAGE:-nginx:alpine}
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend_e2e
      - frontend_e2e
