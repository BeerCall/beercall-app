name: beercall-e2e

volumes:
  uploads_e2e:

services:
  db_e2e:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_e2e:
    build:
      context: ../beercall-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://test_user:test_password@db_e2e:5432/test_db
      - BEERCALL_SECRET_KEY=e2e_super_secret_key_12345
    volumes:
      - uploads_e2e:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db_e2e:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  beer_worker_e2e:
    build:
      context: ../beercall-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://test_user:test_password@db_e2e:5432/test_db
      - BEERCALL_SECRET_KEY=e2e_super_secret_key_12345
    volumes:
      - uploads_e2e:/app/uploads
    depends_on:
      backend_e2e:
        condition: service_started
    command: python -m workers.beer_call_worker

  beer_worker_e2e_2:
    build:
      context: ../beercall-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://test_user:test_password@db_e2e:5432/test_db
      - BEERCALL_SECRET_KEY=e2e_super_secret_key_12345
    volumes:
      - uploads_e2e:/app/uploads
    depends_on:
      backend_e2e:
        condition: service_started
    command: python -m workers.beer_call_worker
