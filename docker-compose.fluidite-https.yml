# Étape 0 — override HTTPS local pour la recette fluidité.
#
# S'utilise EN PLUS du compose de recette (jamais seul) :
#   docker compose -p beercall-fluidite-night `
#     -f beercall-app/docker-compose.fluidite-test.yml `
#     -f beercall-app/docker-compose.fluidite-https.yml `
#     --env-file "C:\Users\Migz3rrr\.opencode\plan\beercall\runs\C01\local-test.env" up -d
#
# - HTTPS : https://192.168.1.30:5443, servi par un conteneur Nginx dédié qui
#   réutilise nginx/local-https.conf et le certificat existant de
#   secrets/local-https (SAN = beercall.local, localhost, 192.168.1.30, 127.0.0.1).
# - HTTP  : `nginx_beercall` reste inchangé (nginx/default.conf) et n'écoute plus
#   que sur 127.0.0.1:5180 (cf. docker-compose.fluidite-test.yml).
# - Le port hôte 443 est déjà pris par `beercall_proxy_internal` (stack prod),
#   d'où l'exposition de 5443 -> 443 dans le conteneur.
# - Nginx HTTPS sert /models/ depuis le catalogue GLB monté en lecture seule.

services:
  nginx_https:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "5443:443"
    volumes:
      - ./nginx/local-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/local-https/server.crt:/etc/nginx/certs/server.crt:ro
      - ./secrets/local-https/server.key:/etc/nginx/certs/server.key:ro
      - ./secrets/local-https/ca.crt:/usr/share/nginx/local/ca.crt:ro
      - ./secrets/local-https/setup.html:/usr/share/nginx/local/setup.html:ro
      - ../beercall-backend/static/models:/srv/models:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ca.crt"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      beercall.test: "fluidite-night"
