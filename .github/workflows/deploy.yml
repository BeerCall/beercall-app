name: Deploy Production

on:
  push:
    branches:
      - main
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30m
          script: |
            cd $HOME/beercall-app
            
            # Sauvegarder le SHA précédent pour rollback documenté
            PREV_SHA=$(git rev-parse HEAD || echo "unknown")
            echo "SHA précédent pour rollback : $PREV_SHA"
            
            # Bootstrap .gitignore since the previous deployment didn't have it
            git fetch origin main
            git checkout FETCH_HEAD -- .gitignore 2>/dev/null || true

            # Vider les sous-modules pour éviter le statut sale "M SC" dû aux vieux gitlinks de l'ancien HEAD
            git submodule deinit -f --all

            # Nettoyer l'état staging du bootstrap de .gitignore (A)
            git reset HEAD .gitignore 2>/dev/null || true

            # Vérifier que le dépôt n'est pas sale avant modification (en ignorant les erreurs de permission sur les dossiers ignorés)
            if [ -n "$(git status --porcelain=v2 2>/dev/null | grep -v '^\?')" ]; then
              echo "Erreur : le dépôt VPS est sale, modifications locales détectées :"
              git status --porcelain=v2 2>/dev/null
              exit 1
            fi
            
            # Mettre à jour le parent en récupérant le commit exact
            git fetch origin
            git checkout --detach ${{ github.sha }}
            
            # Mettre à jour les sous-modules exactement sur les SHA épinglés
            git submodule sync
            git submodule update --init --recursive
            
            # Afficher les trois SHA
            echo "Parent SHA déployé : $(git rev-parse HEAD)"
            git submodule status
            
            # Copier le .env racine dans les sous-modules (indispensable pour ViteJS)
            cp .env beercall-frontend/.env 2>/dev/null || true
            cp .env beercall-backend/.env 2>/dev/null || true

            # On reconstruit avec Docker Compose
            docker compose up -d --build
            
            # On force Nginx à recharger sa configuration (applique le fix DNS)
            docker compose exec -T nginx_beercall nginx -s reload || true
            
            # On nettoie les anciennes images
            docker image prune -f
