name: Deploy Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beercall-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate pinned release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_only_password
      DB_NAME: beercall_test
      BEERCALL_E2E_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15-alpine
      BEERCALL_E2E_PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.13-slim
      BEERCALL_E2E_NODE_IMAGE: public.ecr.aws/docker/library/node:22-alpine
      BEERCALL_E2E_NGINX_IMAGE: public.ecr.aws/docker/library/nginx:stable-alpine
      BEERCALL_E2E_PROXY_IMAGE: public.ecr.aws/docker/library/nginx:alpine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare isolated test keys
        run: |
          for name in BEERCALL_SECRET_KEY BEERCALL_E2E_SECRET_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Test backup and rollback guards offline
        run: python3 -B -m unittest discover -s scripts/tests -p test_prod_safety.py -v
      - name: Validate gitlinks and Compose
        run: |
          git submodule status
          if git submodule status | grep -E '^[-+U]'; then exit 1; fi
          docker compose config --quiet
          docker compose -f docker-compose.e2e.yml config --quiet
      - name: Validate production topology and avatar rendering files
        run: |
          set -euo pipefail
          services="$(docker compose config --services)"
          for service in backend frontend db_beercall beer_worker daily_worker avatar-renderer avatar-sprite-worker; do
            if ! printf '%s\n' "$services" | grep -Fxq "$service"; then
              echo "Service de production manquant : $service"
              exit 1
            fi
          done
          test -f beercall-frontend/tools/avatar-renderer/Dockerfile
          test -f beercall-backend/workers/avatar_sprite_worker.py
          test -f beercall-backend/workers/beer_call_worker.py
      - name: Install smoke dependencies
        run: python -m pip install httpx websockets
      - name: Resolve and pull base images
        run: |
          set -euo pipefail
          resolve() {
            local ecr="$1" hub="$2"
            for image in "$ecr" "$hub"; do
              for attempt in 1 2; do
                if docker pull "$image" >&2; then
                  echo "$image"
                  return 0
                fi
                sleep $((attempt * 10))
              done
            done
            return 1
          }
          POSTGRES=$(resolve "$BEERCALL_E2E_POSTGRES_IMAGE" "postgres:15-alpine")
          PROXY=$(resolve "$BEERCALL_E2E_PROXY_IMAGE" "nginx:alpine")
          PYTHON=$(resolve "$BEERCALL_E2E_PYTHON_IMAGE" "python:3.13-slim")
          NODE=$(resolve "$BEERCALL_E2E_NODE_IMAGE" "node:22-alpine")
          NGINX=$(resolve "$BEERCALL_E2E_NGINX_IMAGE" "nginx:stable-alpine")
          {
            echo "BEERCALL_E2E_POSTGRES_IMAGE=$POSTGRES"
            echo "BEERCALL_E2E_PROXY_IMAGE=$PROXY"
            echo "BEERCALL_E2E_PYTHON_IMAGE=$PYTHON"
            echo "BEERCALL_E2E_NODE_IMAGE=$NODE"
            echo "BEERCALL_E2E_NGINX_IMAGE=$NGINX"
          } >> "$GITHUB_ENV"
      - name: Build and start isolated release
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 180; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1
      - name: Test proxied release and worker recovery
        env:
          BEERCALL_E2E_RESTART_WORKERS: 'true'
        run: python scripts/smoke_e2e.py
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail 150
      - name: Stop isolated release
        if: always()
        run: docker compose -f docker-compose.e2e.yml down

  e2e-browser:
    name: E2E browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BEERCALL_E2E_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:15-alpine
      BEERCALL_E2E_PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.13-slim
      BEERCALL_E2E_NODE_IMAGE: public.ecr.aws/docker/library/node:22-alpine
      BEERCALL_E2E_NGINX_IMAGE: public.ecr.aws/docker/library/nginx:stable-alpine
      BEERCALL_E2E_PROXY_IMAGE: public.ecr.aws/docker/library/nginx:alpine
      BEERCALL_EXPECT_HDR: absent
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Prepare isolated test key
        run: |
          value=$(openssl rand -hex 32)
          echo "::add-mask::$value"
          echo "BEERCALL_E2E_SECRET_KEY=$value" >> "$GITHUB_ENV"
      - name: Validate pinned gitlinks
        run: |
          if git submodule status | grep -E '^[-+U]'; then exit 1; fi
      - name: Resolve and pull base images
        run: |
          set -euo pipefail
          resolve() {
            local ecr="$1" hub="$2"
            for image in "$ecr" "$hub"; do
              for attempt in 1 2; do
                if docker pull "$image" >&2; then
                  echo "$image"
                  return 0
                fi
                sleep $((attempt * 10))
              done
            done
            return 1
          }
          POSTGRES=$(resolve "$BEERCALL_E2E_POSTGRES_IMAGE" "postgres:15-alpine")
          PROXY=$(resolve "$BEERCALL_E2E_PROXY_IMAGE" "nginx:alpine")
          PYTHON=$(resolve "$BEERCALL_E2E_PYTHON_IMAGE" "python:3.13-slim")
          NODE=$(resolve "$BEERCALL_E2E_NODE_IMAGE" "node:22-alpine")
          NGINX=$(resolve "$BEERCALL_E2E_NGINX_IMAGE" "nginx:stable-alpine")
          {
            echo "BEERCALL_E2E_POSTGRES_IMAGE=$POSTGRES"
            echo "BEERCALL_E2E_PROXY_IMAGE=$PROXY"
            echo "BEERCALL_E2E_PYTHON_IMAGE=$PYTHON"
            echo "BEERCALL_E2E_NODE_IMAGE=$NODE"
            echo "BEERCALL_E2E_NGINX_IMAGE=$NGINX"
          } >> "$GITHUB_ENV"
      - name: Build and start browser test composition
        run: |
          for attempt in 1 2; do
            if docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 180; then exit 0; fi
          done
          exit 1
      - name: Install isolated browser test dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: e2e
        run: npx playwright test
      - name: Capture composition logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color --tail 150 > e2e-compose.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-browser-failure
          path: |
            e2e-compose.log
            e2e/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove ephemeral test containers and volumes
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  deploy:
    needs: [validate, e2e-browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a stale production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$latest" != "${{ github.sha }}" ]; then
            echo "Release obsolète : main=${latest}, run=${GITHUB_SHA}. Aucun déploiement."
            exit 1
          fi
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -eu
            umask 077
            exec 9>"$HOME/.beercall-release.lock"
            flock -n 9 || { echo "Une opération de release est déjà en cours" >&2; exit 1; }
            cd $HOME/beercall-app

            # Re-check on the VPS under the same lock as backup and rollback.
            git fetch origin
            if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
              echo "Release obsolète sur le VPS ; aucun checkout ni redémarrage."
              exit 1
            fi
            PREV_SHA=$(git rev-parse HEAD)
            # Read the reviewed helper from the fetched release without checking
            # it out first (bootstrap: it does not yet exist on the old VPS).
            BACKUP_ROOT="${BEERCALL_BACKUP_DIR:-$HOME/beercall_backups}"
            BACKUP_MARKER="$BACKUP_ROOT/LATEST"
            SAFETY=$(git show "${{ github.sha }}:scripts/prod_safety.py")
            printf '%s\n' "$SAFETY" | python3 - verify-backup "$BACKUP_MARKER" "$PREV_SHA"

            # Sauvegarder le SHA précédent pour rollback documenté
            echo "SHA précédent pour rollback : $PREV_SHA"
            
            # Conserver les uploads et .env non suivis ; ne jamais forcer/deinit les modules.
            if [ -n "$(git status --porcelain --untracked-files=no --ignore-submodules=untracked)" ]; then
              echo "Erreur : le dépôt VPS est sale, modifications locales détectées :"
              git status --porcelain --untracked-files=no --ignore-submodules=untracked
              exit 1
            fi
            
            # Mettre à jour le parent en récupérant le commit exact
            git checkout --detach ${{ github.sha }}
            
            # Mettre à jour les sous-modules exactement sur les SHA épinglés
            git submodule sync
            git submodule update --init --recursive
            
            # Afficher les trois SHA
            echo "Parent SHA déployé : $(git rev-parse HEAD)"
            git submodule status
            
            # Copier le .env racine dans les sous-modules (indispensable pour ViteJS)
            cp .env beercall-frontend/.env
            cp .env beercall-backend/.env

            # On reconstruit avec Docker Compose
            docker compose up -d --build --wait --wait-timeout 180
            
            # Git peut remplacer l'inode du fichier monté nginx/default.conf.
            # Un reload seul peut alors relire l'ancien fichier : renouveler le montage.
            docker compose up -d --no-deps --force-recreate --wait --wait-timeout 60 nginx_beercall

            # Valider la configuration du nouveau conteneur et le routage API.
            docker compose exec -T nginx_beercall nginx -t
            docker compose exec -T nginx_beercall nginx -s reload
            docker compose exec -T nginx_beercall wget -qO- http://127.0.0.1/api/health/ready
            echo "${{ github.sha }} $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$HOME/beercall-releases.log"
            docker compose ps
