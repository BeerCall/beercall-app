map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP : téléchargement du CA local et redirection vers HTTPS.
# Le service worker/PWA exige HTTPS ; HTTP ne sert qu'à installer le certificat.
server {
    listen 80;
    server_name _;

    location = /ca.crt {
        root /usr/share/nginx/local;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="beercall-ca.crt"';
    }

    location = /setup {
        root /usr/share/nginx/local;
        default_type text/html;
        try_files /setup.html =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20M;
    error_page 404 = @not_found;
    location @not_found {
        types { }
        default_type text/plain;
        add_header Cache-Control no-store always;
        return 404 "Not Found\n";
    }

    # Résolveur DNS interne de Docker pour éviter les 502 au redéploiement
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $frontend_host "frontend";
    set $backend_host "backend";

    # Assets Vite hashés : proxy direct vers frontend, sans interception d'erreurs
    location /assets/ {
        proxy_pass http://$frontend_host:80;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Packs et manifestes d'animation : proxy direct vers frontend, sans interception d'erreurs
    location /animations/ {
        proxy_pass http://$frontend_host:80;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (routes SPA, entrypoints racine, manifestes PWA, Service Workers)
    location / {
        proxy_pass http://$frontend_host:80;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    location = /models/prepared/manifest.json {
        root /srv;
        gzip_static on;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control no-cache always;
        try_files $uri =404;
    }

    location ^~ /models/ {
        root /srv;
        gzip_static on;
        default_type application/octet-stream;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control no-cache always;
        location ~* \.gz$ {
            add_header Cache-Control no-store always;
            return 404;
        }
        location ~ "^/models/prepared/[A-Za-z0-9_-]+\.[a-f0-9]{64}\.bc3d$" {
            gzip_static on;
            add_header Vary Accept-Encoding always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }
        try_files $uri =404;
    }

    location /uploads/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
