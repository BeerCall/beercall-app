server {
    listen 80;

    client_max_body_size 20M;

    # Résolveur DNS interne de Docker pour éviter les 502 au redéploiement
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Variables pour forcer la résolution dynamique par Nginx
    set $frontend_host "frontend";
    set $backend_host "backend";

    # Frontend
    location / {
        proxy_pass http://$frontend_host:80;

        # 🚀 LE VRAI FIX POUR LES SPA (Single Page Applications)
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }

    location /api/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /models/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://$backend_host:8000;
    }
}