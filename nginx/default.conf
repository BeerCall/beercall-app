map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;

    client_max_body_size 20M;

    # Résolveur DNS interne de Docker pour éviter les 502 au redéploiement
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Variables pour forcer la résolution dynamique par Nginx
    set $frontend_host "frontend";
    set $backend_host "backend";

    # Assets Vite hashés : proxy direct vers frontend, sans interception d'erreurs
    location /assets/ {
        proxy_pass http://$frontend_host:80;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Packs et manifestes d'animation : proxy direct vers frontend, sans interception d'erreurs
    location /animations/ {
        proxy_pass http://$frontend_host:80;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (routes SPA, entrypoints racine, manifestes PWA, Service Workers)
    # L'interception d'erreurs est désactivée : le frontend distingue lui-même les routes SPA des assets manquants
    location / {
        proxy_pass http://$frontend_host:80;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    # Manifeste GLB : toujours revalide pour publier un nouveau catalogue sans purge.
    location = /models/glb/manifest.json {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-cache";
    }

    # GLB versionnes : immuables pendant un an. Sans `always`, les 404/5xx
    # pendant une generation ne sont jamais mis en cache par les clients.
    location /models/glb/v1/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /models/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Avatars generes : immuables seulement sur une reponse valide.
    location /uploads/avatars/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}